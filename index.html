<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Faltas - Atacadão Farma Centro</title>

<style>
body { font-family: Arial; background:#f4f4f4; margin:0; }
header { background:linear-gradient(135deg,#cc0000,#ff1a1a); color:#fff; text-align:center; padding:20px; }
.container { max-width:1000px; margin:20px auto; padding:0 15px; }

.produto {
  background:#fff;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button {
  background:#28a745;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:5px;
  cursor:pointer;
  margin-left:5px;
}

button.remover { background:#dc3545; }

input {
  padding:10px;
  width:70%;
  margin-right:10px;
}

.add-box {
  display:flex;
  margin-bottom:20px;
}
</style>
</head>

<body>
<header>
<h2>📦 Controle de Faltas - Atacadão Farma Centro</h2>
</header>

<div class="container">

<div class="add-box">
<input type="text" id="novoProduto" placeholder="Adicionar novo produto...">
<button onclick="addProduto()">Adicionar</button>
</div>

<div id="lista"></div>

</div>

<script>
let produtos = [
"Dipirona gotas",
"Naridrin 12 horas",
"Albendazol líquido",
"Albendazol 1 comprimido",
"Albendazol 3 comprimidos",
"Repoflor",
"Diclofenaco comprimido",
"Vitamina D 50.000 UI",
"Ácido fólico",
"Sulfato ferroso comprimido",
"Passiflora",
"Silimarina",
"Colírio de carmelose",
"Clopidogrel",
"Paracetamol gotas",
"Dipirona xarope",
"Bromoprida gotas",
"Bromoprida comprimido",
"Triancinolona + acetonida pomada",
"Hidróxido de alumínio",
"Domperidona",
"Desloratadina líquida",
"Prednisolona líquida",
"Prednisona 40 mg",
"Budesonida 32 mcg",
"Neolefrin xarope",
"Imosec",
"Kaosec",
"Secnidazol",

"Dipirona 500mg cartela",
"Paracetamol baby",
"Ibuprofeno gotas 50mg/ml",
"Dorflex cartela",
"Doralgina",
"Meloxicam",
"Ciclobenzaprina 10 mg (15 comprimidos)",
"Ciclobenzaprina 10 mg (30 comprimidos)",
"Pomada de Diclofenaco",
"Fluconazol",
"Keltrina 5%",

"Expectamin xarope",
"EMS Expector",
"Descon xarope",
"Xarope de guaco",
"Hedera helix",
"Ambroxol infantil",
"Acetilcisteína infantil",
"Dropropizina infantil",
"Vick / Neorub",

"Histamin gotas",
"Histamin comprimido",
"Desclorfeniramina",
"Loratadina (Alerodina)",

"Metoprolol 50 mg",
"Metformina 500 mg",
"Metformina 850 mg",
"Lactulose",

"Levotiroxina 25 mcg",
"Levotiroxina 50 mcg",
"Levotiroxina 75 mcg",
"Levotiroxina 100 mcg",

"Seringas 3 ml",
"Seringas 5 ml"
];

function render() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  produtos.forEach((item, index) => {
    lista.innerHTML += `
    <div class="produto">
      ${item}
      <div>
        <button onclick="darBaixa(${index})">Deu entrada</button>
        <button class="remover" onclick="remover(${index})">X</button>
      </div>
    </div>`;
  });
}

function darBaixa(index) {
  produtos.splice(index, 1);
  render();
}

function remover(index) {
  produtos.splice(index, 1);
  render();
}

function addProduto() {
  const input = document.getElementById("novoProduto");
  if(input.value.trim() !== ""){
    produtos.push(input.value);
    input.value = "";
    render();
  }
}

render();
</script>

</body>
</html>
