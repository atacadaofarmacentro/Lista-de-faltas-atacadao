<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Faltas - Atacadão Farma Centro</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; color: #333; }
        
        header {
            background: linear-gradient(135deg, #dc3545, #ff6b6b);
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        h1 { margin: 0; font-size: 2.3em; }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .categoria {
            margin: 30px 0 15px;
        }

        .categoria h2 {
            background: #dc3545;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 1.5em;
        }

        .produto {
            background: white;
            border: 1px solid #ddd;
            border-left: 6px solid #dc3545;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 10px 0;
            font-size: 1.1em;
        }

        .urgente {
            background: #ffe6e6;
            border-left: 6px solid #ff0000;
            font-weight: bold;
        }

        .ok {
            background: #e6ffe6;
            border-left: 6px solid #28a745;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>🚨 LISTA DE FALTAS 🚨</h1>
    <p>Controle interno de reposição de estoque</p>
</header>

<div class="container">

    <!-- MEDICAMENTOS -->
    <div class="categoria">
        <h2>💊 MEDICAMENTOS</h2>

        <div class="produto urgente">Dipirona 1g</div>
        <div class="produto urgente">Losartana</div>
        <div class="produto">Loratadina</div>
        <div class="produto">Simeticona</div>
    </div>

    <!-- HIGIENE -->
    <div class="categoria">
        <h2>🧴 HIGIENE</h2>

        <div class="produto urgente">Colgate</div>
        <div class="produto">Listerine</div>
        <div class="produto urgente">Carmed</div>
    </div>

    <!-- INFANTIL -->
    <div class="categoria">
        <h2>👶 INFANTIL</h2>

        <div class="produto urgente">Lenço umedecido</div>
        <div class="produto">Cotonete</div>
    </div>

    <!-- SUPLEMENTOS -->
    <div class="categoria">
        <h2>🍊 SUPLEMENTOS</h2>

        <div class="produto urgente">Vitamina C</div>
        <div class="produto">Magnésio</div>
    </div>

</div>

<footer>
    <p>📦 Atualize diariamente</p>
    <p>💊 Atacadão Farma Centro</p>
</footer>

</body>
</html>
